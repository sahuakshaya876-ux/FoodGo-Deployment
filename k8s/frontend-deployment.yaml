apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodgo-frontend
  namespace: foodgo
  labels:
    app: foodgo-frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: foodgo-frontend
  template:
    metadata:
      labels:
        app: foodgo-frontend
    spec:
      containers:
        - name: foodgo-frontend
          # Placeholder image: replaced by Ansible/Jenkins with the real ECR
          # image URI and immutable tag at deploy time.
          image: akshayasahh/foodgo-frontend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
