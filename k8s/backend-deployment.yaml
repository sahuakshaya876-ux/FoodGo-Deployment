apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodgo-backend
  namespace: foodgo
  labels:
    app: foodgo-backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: foodgo-backend
  template:
    metadata:
      labels:
        app: foodgo-backend
    spec:
      containers:
        - name: foodgo-backend
          # Placeholder image: replaced by Ansible/Jenkins with the real ECR
          # image URI and immutable tag (e.g. the Git commit SHA or build number)
          # at deploy time. Do not hard-code a real registry here.
          image: akshayasahh/foodgo-backend:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: foodgo-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodgo-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foodgo-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
