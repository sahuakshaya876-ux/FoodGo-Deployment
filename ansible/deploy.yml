---
# FoodGo Kubernetes deployment playbook
#
# Used by Jenkins to deploy FoodGo to a local Minikube cluster.
#
# Required tools on the Jenkins/Ansible control node:
#   - kubectl
#   - ansible
#
# Docker images are pulled from Docker Hub.

- name: Deploy FoodGo to Minikube
  hosts: eks_control
  gather_facts: false

  vars:
    k8s_manifest_dir: "{{ playbook_dir }}/../k8s"
    namespace: foodgo
    backend_deployment: foodgo-backend
    frontend_deployment: foodgo-frontend
    rollout_timeout: 180s

    dockerhub_user: "akshayasahh"
    backend_image: "{{ dockerhub_user }}/foodgo-backend:{{ image_tag }}"
    frontend_image: "{{ dockerhub_user }}/foodgo-frontend:{{ image_tag }}"

  tasks:

    - name: Verify kubectl is installed
      command: kubectl version --client=true
      register: kubectl_check
      changed_when: false

    - name: Verify Kubernetes cluster connectivity
      command: kubectl cluster-info
      register: cluster_info
      changed_when: false

    - name: Fail if Kubernetes cluster is unreachable
      fail:
        msg: "Unable to reach the Minikube Kubernetes cluster."
      when: cluster_info.rc != 0

    - name: Apply namespace manifest
      command: kubectl apply -f {{ k8s_manifest_dir }}/namespace.yaml
      changed_when: true

    - name: Apply ConfigMap
      command: kubectl apply -f {{ k8s_manifest_dir }}/configmap.yaml
      changed_when: true

    - name: Apply Secret
      command: kubectl apply -f {{ k8s_manifest_dir }}/secret.yaml
      changed_when: true

    - name: Apply PostgreSQL
      command: kubectl apply -f {{ k8s_manifest_dir }}/postgres.yaml
      changed_when: true

    - name: Update backend image in deployment
      replace:
        path: "{{ k8s_manifest_dir }}/backend-deployment.yaml"
        regexp: 'image: .*foodgo-backend:.*'
        replace: "image: {{ backend_image }}"

    - name: Update frontend image in deployment
      replace:
        path: "{{ k8s_manifest_dir }}/frontend-deployment.yaml"
        regexp: 'image: .*foodgo-frontend:.*'
        replace: "image: {{ frontend_image }}"

    - name: Apply backend Deployment
      command: kubectl apply -f {{ k8s_manifest_dir }}/backend-deployment.yaml
      changed_when: true

    - name: Apply backend Service
      command: kubectl apply -f {{ k8s_manifest_dir }}/backend-service.yaml
      changed_when: true

    - name: Apply frontend Deployment
      command: kubectl apply -f {{ k8s_manifest_dir }}/frontend-deployment.yaml
      changed_when: true

    - name: Apply frontend Service
      command: kubectl apply -f {{ k8s_manifest_dir }}/frontend-service.yaml
      changed_when: true

    - name: Apply FoodGo Ingress
      command: kubectl apply -f {{ k8s_manifest_dir }}/ingress.yaml
      changed_when: true

    - name: Wait for PostgreSQL rollout
      command: >
        kubectl rollout status deployment/foodgo-postgres
        -n {{ namespace }} --timeout={{ rollout_timeout }}
      register: postgres_rollout
      changed_when: false
      failed_when: false

    - name: Wait for backend rollout
      command: >
        kubectl rollout status deployment/{{ backend_deployment }}
        -n {{ namespace }} --timeout={{ rollout_timeout }}
      register: backend_rollout
      changed_when: false

    - name: Wait for frontend rollout
      command: >
        kubectl rollout status deployment/{{ frontend_deployment }}
        -n {{ namespace }} --timeout={{ rollout_timeout }}
      register: frontend_rollout
      changed_when: false

    - name: Verify backend pods
      command: >
        kubectl get pods -n {{ namespace }}
        -l app={{ backend_deployment }} -o wide
      register: backend_pods
      changed_when: false

    - name: Verify frontend pods
      command: >
        kubectl get pods -n {{ namespace }}
        -l app={{ frontend_deployment }} -o wide
      register: frontend_pods
      changed_when: false

    - name: Verify PostgreSQL pods
      command: >
        kubectl get pods -n {{ namespace }}
        -l app=foodgo-postgres -o wide
      register: postgres_pods
      changed_when: false

    - name: Verify Kubernetes services
      command: kubectl get svc -n {{ namespace }}
      register: services_output
      changed_when: false

    - name: Print deployment summary
      debug:
        msg:
          - "PostgreSQL rollout: {{ 'SUCCESS' if postgres_rollout.rc == 0 else 'CHECK STATUS' }}"
          - "Backend rollout: {{ 'SUCCESS' if backend_rollout.rc == 0 else 'FAILED' }}"
          - "Frontend rollout: {{ 'SUCCESS' if frontend_rollout.rc == 0 else 'FAILED' }}"
          - "Backend pods: {{ backend_pods.stdout_lines }}"
          - "Frontend pods: {{ frontend_pods.stdout_lines }}"
          - "PostgreSQL pods: {{ postgres_pods.stdout_lines }}"
          - "Services: {{ services_output.stdout_lines }}"

    - name: Fail if backend or frontend rollout failed
      fail:
        msg: "FoodGo deployment failed — check the rollout status output above."
      when: backend_rollout.rc != 0 or frontend_rollout.rc != 0